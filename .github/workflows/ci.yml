name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e 'plant-care[dev]'
      - run: ruff format --check plant-care/app/backend plant-care/tests
      - run: ruff check plant-care/app/backend plant-care/tests
      - run: mypy plant-care/app/backend
      - run: pytest plant-care/tests/backend --cov=plantcare --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plant-care/app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plant-care/app/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      matrix:
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Home Assistant startup permissions
        run: |
          test -x plant-care/rootfs/run-plantcare.sh
          grep -Fq "/run-plantcare.sh rix," plant-care/apparmor.txt
          grep -Fq "/usr/bin/jq ix," plant-care/apparmor.txt
          grep -Fq "/opt/venv/bin/alembic rix," plant-care/apparmor.txt
          grep -Fq "/opt/venv/bin/uvicorn rix," plant-care/apparmor.txt
          grep -Fq "/usr/bin/supervisord rix," plant-care/apparmor.txt
          grep -Fq "/usr/sbin/nginx ix," plant-care/apparmor.txt
          grep -Fq "/usr/local/lib/** mr," plant-care/apparmor.txt
          grep -Fq "/var/lib/nginx/ rw," plant-care/apparmor.txt
          grep -Fq "nginx -e /dev/stderr" plant-care/rootfs/etc/supervisord.conf
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: plant-care
          platforms: linux/${{ matrix.arch }}
          push: false
          tags: plant-care:${{ matrix.arch }}
