name: Plant Care Dashboard
version: "0.3.0"
slug: plant_care
description: Local-first plant sensor guidance and shared care actions
url: https://github.com/Shandowww/plant-care
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:sprout
panel_title: Plant Care
panel_admin: false
homeassistant_api: true
host_network: false
apparmor: true
ports:
  8098/tcp: 8098
ports_description:
  8098/tcp: LAN-only dashboard (do not expose to the internet)
webui: http://[HOST]:[PORT:8098]
watchdog: http://[HOST]:8099/api/v1/health
backup: hot
stage: experimental
options:
  log_level: info
schema:
  log_level: list(debug|info|warning|error)
