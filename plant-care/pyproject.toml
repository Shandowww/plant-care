[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "plant-care-dashboard"
version = "0.5.0"
description = "Local-first Home Assistant plant care dashboard"
requires-python = ">=3.14,<3.15"
dependencies = [
  "aiosqlite==0.21.0",
  "alembic==1.19.1",
  "argon2-cffi==25.1.0",
  "fastapi==0.140.5",
  "greenlet==3.5.5",
  "httpx2==2.10.0",
  "itsdangerous==2.2.0",
  "pillow==12.3.0",
  "pillow-heif==1.7.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "python-multipart==0.0.20",
  "sqlalchemy==2.0.51",
  "structlog==25.4.0",
  "uvicorn==0.52.3",
]

[project.optional-dependencies]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "pytest-cov==6.2.1",
  "ruff==0.12.9",
]

[tool.hatch.build.targets.wheel]
packages = ["app/backend/plantcare"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/backend"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["argon2.*"]
ignore_missing_imports = true
