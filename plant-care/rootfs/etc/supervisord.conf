[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:plantcare]
command=/opt/venv/bin/uvicorn plantcare.main:create_app --factory --app-dir /app/app/backend --host 127.0.0.1 --port 8080 --proxy-headers --forwarded-allow-ips=127.0.0.1
directory=/app
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=TERM

[program:nginx]
command=/usr/sbin/nginx -e /dev/stderr -g "daemon off;"
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=QUIT
