worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 512;
}
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  keepalive_timeout 30;
  client_max_body_size 12m;

  upstream plantcare_api {
    server 127.0.0.1:8080;
    keepalive 8;
  }

  server {
    listen 8099;
    server_name _;

    # Home Assistant Supervisor ingress gateway. LAN clients use port 8098.
    allow 172.30.32.2;
    allow 127.0.0.1;
    deny all;

    location / {
      proxy_pass http://plantcare_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-PlantCare-Surface ingress;
      proxy_set_header X-Remote-User-Name $http_x_remote_user_name;
      proxy_set_header X-Remote-User-Display-Name $http_x_remote_user_display_name;
    }
  }

  server {
    listen 8098;
    server_name _;

    location / {
      proxy_pass http://plantcare_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-PlantCare-Surface lan;
      proxy_set_header X-Remote-User-Name "";
      proxy_set_header X-Remote-User-Display-Name "";
    }
  }
}
