configuration:
  log_level:
    name: Log level
    description: Controls application log detail. Secrets and photo content are always excluded.
  stale_sensor_hours:
    name: Unchanged sensor threshold
    description: Create a sensor warning when a mapped moisture, temperature, or illuminance value has not changed for this many hours.
  home_assistant_notifications:
    name: Home Assistant notifications
    description: Send persistent Home Assistant notifications for new sensor warnings and dismiss them automatically after recovery.
network:
  8098/tcp: LAN-only dashboard port. Never forward this port to the internet.
